<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>One</title>
<style>
:root{
  --r:#e4443a; --g:#3aa757; --b:#2b7fd4; --y:#e8b91f;
  --felt:#143a2b; --felt2:#0b241b;
  --ink:#f4f1e8; --dim:#94a49b;
  --card-w:64px; --card-h:96px; --card-radius:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(ellipse at 50% 32%,var(--felt) 0%,var(--felt2) 68%,#061410 100%);
  color:var(--ink);
  font-family:ui-rounded,-apple-system,"Segoe UI",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}
h1.logo{
  font-size:74px;line-height:.95;margin:0;font-weight:900;letter-spacing:-5px;
  background:linear-gradient(135deg,var(--y),var(--r) 45%,var(--b) 85%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  transform:rotate(-7deg)
}
.sub{font-size:13px;letter-spacing:5px;text-transform:uppercase;color:var(--dim);margin-top:-2px}
/* 'safe center' centra finché c'è spazio, ma quando il contenuto è più alto
   dello schermo torna ad allinearsi in alto. Con il semplice 'center' la
   parte iniziale finisce fuori dall'area scorrevole e non la raggiungi più. */
.center{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;justify-content:safe center;
  gap:14px;padding:22px;overflow-y:auto;overscroll-behavior:contain}
#sc-lobby .center{gap:10px}
#sc-lobby .center>*{flex:none}
input,button{font-family:inherit;font-size:16px}
input[type=text]{
  background:#ffffff14;border:1px solid #ffffff2b;color:var(--ink);
  padding:13px 16px;border-radius:12px;width:100%;max-width:300px;outline:none;text-align:center
}
input[type=text]:focus{border-color:var(--y)}
.btn{
  border:none;border-radius:14px;padding:14px 22px;font-weight:700;cursor:pointer;
  background:var(--y);color:#241d00;width:100%;max-width:300px;transition:transform .08s
}
.btn:active{transform:scale(.97)}
.btn.sec{background:#ffffff1a;color:var(--ink);border:1px solid #ffffff2e}
.btn.sm{width:auto;padding:9px 15px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.35;pointer-events:none}
.muted{color:var(--dim);font-size:13px;text-align:center;line-height:1.5;max-width:320px}
.sep{color:var(--dim);font-size:12px;letter-spacing:2px}

.code{font-size:34px;font-weight:900;letter-spacing:7px;color:var(--y)}
.qrnote{width:172px;min-height:120px;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:12px;line-height:1.6;color:var(--dim);
  border:1px dashed #ffffff30;border-radius:12px;padding:14px}
.pwbox{font-size:11px;color:var(--dim);text-align:center;line-height:1.5}
.pw{font-size:26px;font-weight:900;letter-spacing:6px;color:var(--ink);
  background:#ffffff14;border:1px dashed #ffffff33;border-radius:12px;padding:6px 14px;margin-top:4px}
#qr{background:#fff;border-radius:12px;padding:8px;image-rendering:pixelated;width:156px;height:156px}
/* l'elenco scorre dentro di sé: aggiungere giocatori non deve spingere
   il QR fuori dallo schermo */
.plist{display:flex;flex-direction:column;gap:6px;width:100%;max-width:300px;
  max-height:168px;overflow-y:auto;scrollbar-width:none}
.plist::-webkit-scrollbar{display:none}
.prow{flex:none}
.prow{display:flex;align-items:center;gap:10px;background:#ffffff12;padding:10px 13px;border-radius:11px;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--g);flex:none}
.dot.off{background:#777}
.tag{margin-left:auto;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.opts{width:100%;max-width:300px;display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);cursor:pointer}
.opt input{width:18px;height:18px;accent-color:var(--y);flex:none}
.botrow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);
  border-top:1px solid #ffffff18;padding-top:10px;margin-top:2px}
.botrow b{color:var(--ink);font-size:16px;min-width:14px;text-align:center}
.botrow .chip{padding:4px 10px}
.botrow #bot-minus,.botrow #bot-plus{font-size:16px;line-height:1;padding:3px 10px}

/* il padding in alto lascia spazio all'indicatore dei canali, che è fisso
   in alto a destra e altrimenti copre il quarto giocatore */
.top{display:flex;gap:7px;padding:24px 10px 4px;overflow-x:auto;flex:none;scrollbar-width:none}
.top::-webkit-scrollbar{display:none}
.opp{background:#ffffff10;border:1.5px solid transparent;border-radius:13px;padding:8px 10px;
  min-width:84px;flex:none;text-align:center;position:relative}
.opp.turn{border-color:var(--y);background:#e8b91f22}
.opp.off{opacity:.4}
.opp .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px;margin:0 auto}
.opp .nm .dot{width:7px;height:7px;display:inline-block;vertical-align:middle;margin-right:3px}
.opp .cnt{font-size:20px;font-weight:900;margin-top:1px}
.opp .sc{font-size:10px;color:var(--dim)}
.opp .hoststar{position:absolute;top:-7px;left:-6px;background:var(--y);color:#241d00;
  width:16px;height:16px;border-radius:50%;font-size:10px;font-weight:900;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px #0007}
/* freccia verso il prossimo di turno: rende visibile il giro a colpo
   d'occhio, non solo a parole ("senso orario") sotto al tavolo.           */
.opp .turnarrow{position:absolute;top:50%;right:-12px;transform:translateY(-50%);
  font-size:13px;font-weight:900;color:var(--y);text-shadow:0 1px 3px #000c;z-index:2}
/* mazzetto di carte a ventaglio: dorso a righe, bordo bianco e rotazione,
   altrimenti si leggono come barrette e non come carte */
.stack{position:relative;height:27px;width:100%;margin:2px 0 1px}
.stack i{position:absolute;bottom:1px;left:50%;width:12px;height:17px;
  border-radius:2.5px;border:1px solid #ffffff70;transform-origin:50% 150%;
  background:repeating-linear-gradient(45deg,#242430,#242430 2px,#37374a 2px,#37374a 4px);
  box-shadow:-1px 1px 2px #0006}
.stack.low i{border-color:#e8b91fcc}
.stack.last i{background:linear-gradient(135deg,var(--y),#c69a0f);
  border-color:#fff;box-shadow:0 0 9px #e8b91faa}
.bang{position:absolute;top:-7px;right:-5px;background:var(--r);color:#fff;font-size:10px;
  font-weight:900;padding:2px 6px;border-radius:9px;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}

.table{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
/* il mazzo e la carta in tavola sono il punto in cui si guarda: più grandi */
.piles{display:flex;align-items:center;gap:22px;margin-bottom:16px;--card-w:78px;--card-h:116px}
.piles .card .big{font-size:48px}
.piles .card .cnr{font-size:13px}
.card{width:var(--card-w);height:var(--card-h);border-radius:var(--card-radius);position:relative;
  display:flex;align-items:center;justify-content:center;flex:none;
  font-weight:900;color:#fff;box-shadow:0 5px 14px #0007;border:3px solid #fff;user-select:none}
/* più vicino alle carte vere: il numero domina la carta, leggermente
   inclinato, non un numeretto in mezzo a tanto spazio vuoto.               */
.card .big{font-size:40px;font-style:italic;text-shadow:0 2px 0 #0003}
.card .cnr{position:absolute;font-size:11px;opacity:.92}
.card .cnr.tl{top:3px;left:5px} .card .cnr.br{bottom:3px;right:5px;transform:rotate(180deg)}
.card .cshape{position:absolute;top:4px;right:6px;font-size:10px;opacity:.85;text-shadow:0 1px 0 #0004}
/* la dimensione segue --card-w (non un font-size fisso): resta proporzionata
   alla LARGHEZZA della carta in ogni vista e ad ogni breakpoint, senza una
   regola a parte per ciascuna. Più opaco di prima: sul rosso spariva.      */
.card .cwatermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--card-w) * .85);opacity:.24;color:#fff;pointer-events:none}
/* nella griglia le carte sono piccole ma il simbolo per i daltonici deve
   restare: prima spariva del tutto proprio lì, sulle carte in mano.        */
.hand.griglia .card .cshape{top:2px;right:3px;font-size:8px}
.card.r{background:var(--r)} .card.g{background:var(--g)}
.card.b{background:var(--b)} .card.y{background:var(--y);color:#3b2f00}
.card.w{background:conic-gradient(var(--r) 0 25%,var(--b) 0 50%,var(--y) 0 75%,var(--g) 0)}
.card.back{background:repeating-linear-gradient(45deg,#1b1b24,#1b1b24 6px,#262633 6px,#262633 12px)}
.card.back::after{content:"1";font-size:27px;font-weight:900;color:#fff9;transform:rotate(-12deg)}
.deckwrap{position:relative;cursor:pointer}
.deckwrap .n{position:absolute;bottom:-17px;width:100%;text-align:center;font-size:11px;color:var(--dim)}
.colorbar{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--dim)}
.swatch{width:22px;height:22px;border-radius:6px;border:2px solid #fff6;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#fff;line-height:1}
.log{font-size:12px;color:var(--dim);height:16px;text-align:center;padding:0 16px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.dirn{font-size:12px;color:var(--dim)}
.stackbadge{background:var(--r);color:#fff;font-size:13px;font-weight:900;padding:4px 11px;border-radius:10px}

.handwrap{flex:none;padding:4px 0 8px}
.actions{display:flex;gap:8px;justify-content:center;padding:0 10px 6px;flex-wrap:wrap;min-height:38px}
.handtools{display:flex;gap:7px;justify-content:center;padding:0 10px 4px}
.chip{background:#ffffff12;border:1px solid #ffffff22;color:var(--dim);font-size:11px;
  padding:5px 11px;border-radius:20px;cursor:pointer;font-family:inherit}
.chip.on{background:#e8b91f22;border-color:#e8b91f66;color:var(--y)}
.hand .card{cursor:pointer}

/* --- fila: tutte in orizzontale, si scorre --- */
/* overflow-x:auto forza anche overflow-y ad "auto" (non resta "visible"):
   senza un margine generoso in alto l'anello delle giocabili viene tagliato
   dal bordo del contenitore invece di sfumare oltre la carta.              */
.hand.fila{display:flex;gap:6px;overflow-x:auto;padding:18px 16px 14px;scrollbar-width:none}
.hand.fila::-webkit-scrollbar{display:none}
.hand.fila .card{transition:transform .12s}
.hand.fila .card.ok{transform:translateY(-9px)}

/* --- griglia: tutte visibili insieme, carte piccole --- */
.hand.griglia{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 8px;
  padding:16px 14px;max-height:200px;overflow-y:auto;scrollbar-width:none;
  --card-w:48px;--card-h:72px}
.hand.griglia::-webkit-scrollbar{display:none}
.hand.griglia .card{--card-radius:8px;border-width:2px;border-radius:var(--card-radius);transition:transform .12s}
.hand.griglia .card .big{font-size:28px}
.hand.griglia .card .cnr{font-size:8px}
.hand.griglia .card.ok{transform:translateY(-6px)}

/* --- ventaglio: sovrapposte ad arco, si vede solo la punta --- */
/* overflow-x clip e non hidden: le punte in basso non vanno tagliate */
.hand.fan{position:relative;display:block;height:158px;padding:0;
  overflow:visible;overflow-x:clip;touch-action:none}
/* durante lo scorrimento la transizione lunga strascica: si accorcia */
.hand.fan.dragging .card{transition:transform .07s linear}
.hand.fan .card{position:absolute;bottom:26px;left:50%;margin:0;
  transform-origin:50% 115%;transition:transform .2s cubic-bezier(.2,.8,.3,1),box-shadow .2s;
  box-shadow:-3px 4px 10px #0006}
.hand.fan .card.sel{box-shadow:0 10px 26px #000a;z-index:99!important}
/* anello + bagliore ben visibili sopra qualunque sfondo di carta: prima era
   un filo di 2px, quasi invisibile sulle carte gialle e sul feltro scuro.
   Vale in tutte e tre le viste, non solo nel ventaglio. Il raggio del
   bagliore è pensato apposta per stare dentro il padding di fila/griglia:
   più largo verrebbe tagliato dal loro overflow.                          */
/* Il raggio non è un numero a caso: è quello della carta più l'inset, così
   l'anello resta concentrico invece di sembrare un rettangolo incollato
   sopra — succedeva con un valore fisso, che non seguiva --card-radius
   quando cambia (griglia, o le misure più grandi da desktop).             */
.hand .card.ok::after{content:"";position:absolute;inset:-3px;
  border-radius:calc(var(--card-radius) + 3px);
  box-shadow:0 0 0 3px var(--y),0 0 9px 2px #e8b91f99;pointer-events:none}

/* frecce che indicano altre carte fuori schermo, nella fila orizzontale:
   senza, si scorre "alla cieca" e si finisce per passare senza accorgersi
   che restavano carte giocabili più a destra.                             */
.handscroll{position:relative}
/* cliccabile: non è solo un indizio, scorre davvero al tocco. Utile a chi
   non sa (o non può, su desktop senza trackpad) scorrere la fila a dito.   */
.scrollhint{position:absolute;top:50%;transform:translateY(-50%);
  width:30px;height:30px;border-radius:50%;background:var(--y);color:#241d00;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;
  box-shadow:0 2px 10px #0009;cursor:pointer;opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:5}
.scrollhint.on{opacity:1;pointer-events:auto;animation:pulse 1.4s infinite}
.scrollhint.left{left:2px}
.scrollhint.right{right:2px}

/* Le non giocabili si smorzano solo dove non rovinano la lettura: nel
   ventaglio le carte si sovrappongono, e sbiadirle fa sembrare la mano rotta.
   Lì bastano l'anello e il bagliore sulle giocabili.                       */
.hand.fila .card.no,.hand.griglia .card.no{opacity:.38}
.hand.fan .card.no{opacity:.85}

/* suggerimenti spenti: nessuna carta viene evidenziata */
.hand.noaiuti .card.no{opacity:1}
.hand.noaiuti .card.ok::after{display:none}
.hand.fila.noaiuti .card.ok,.hand.griglia.noaiuti .card.ok{transform:none}
.mystatus{text-align:center;font-size:13px;font-weight:700;height:18px;color:var(--y)}

.ov{position:fixed;inset:0;background:#000c;backdrop-filter:blur(7px);display:none;
  align-items:center;justify-content:center;padding:24px;z-index:50}
.ov.on{display:flex}
.panel{background:#18291f;border:1px solid #ffffff1f;border-radius:20px;padding:24px;
  width:100%;max-width:340px;text-align:center;max-height:85vh;overflow:auto}
.panel h2{margin:0 0 6px;font-size:21px}
.colorpick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.cp{height:62px;border-radius:14px;border:3px solid #fff3;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:26px}
.scoretab{width:100%;font-size:14px;margin-top:12px;border-collapse:collapse}
.scoretab td{padding:7px 4px;border-bottom:1px solid #ffffff14;text-align:left}
.scoretab td:last-child{text-align:right;font-weight:900}
.net{position:fixed;top:calc(4px + env(safe-area-inset-top));right:8px;font-size:10px;
  color:var(--dim);background:#0006;padding:3px 7px;border-radius:7px;z-index:40}
.langsel{position:fixed;top:calc(4px + env(safe-area-inset-top));left:8px;font-size:10px;
  color:var(--ink);background:#0006;border:1px solid #ffffff2b;border-radius:7px;
  padding:2px 4px;z-index:40}

/* Su schermi larghi il layout pensato per il telefono restava minuscolo in
   mezzo alla pagina. Qui si allarga tutto (carte, testi, tocco) e si
   racchiude in un pannello centrato, invece di stirare i singoli elementi
   su tutta la larghezza: un tavolo da gioco più grande, non più largo.     */
html{background:radial-gradient(ellipse at 50% 20%,#0f2a1e 0%,#040f0b 70%)}
@media (min-width:680px){
  body{max-width:560px;margin:0 auto;box-shadow:0 0 0 1px #ffffff14,0 30px 80px #000a}
  :root{--card-w:74px;--card-h:110px}
  h1.logo{font-size:92px}
  .card .big{font-size:46px}
  .piles{--card-w:96px;--card-h:142px;gap:28px}
  .piles .card .big{font-size:58px}
  .hand.fan{height:190px}
  .hand.fan .card{bottom:32px}
  .hand.griglia{--card-w:58px;--card-h:87px}
  .hand.griglia .card .big{font-size:34px}
  input[type=text],.btn{max-width:340px}
  .qrnote,#qr{width:184px;height:184px}
}
</style>
</head>
<body>

<div class="net" id="net">—</div>
<select class="langsel" id="langsel"></select>

<div class="screen on" id="sc-home">
  <div class="center">
    <h1 class="logo">1</h1>
    <div class="sub" data-i18n="app.tagline"></div>
    <div class="muted" data-i18n-html="home.desc"></div>
    <input type="text" id="nick" maxlength="12" data-i18n-ph="ph.name">
    <input type="text" id="createpass" maxlength="16" data-i18n-ph="ph.roomPassword"
           style="text-transform:uppercase;letter-spacing:3px">
    <button class="btn" id="b-create" data-i18n="home.createBtn"></button>
    <div class="sep" data-i18n="home.or"></div>
    <input type="text" id="joincode" maxlength="6" data-i18n-ph="ph.code" style="text-transform:uppercase">
    <input type="text" id="joinpass" maxlength="16" data-i18n-ph="ph.password" style="text-transform:uppercase;letter-spacing:3px">
    <button class="btn sec" id="b-join" data-i18n="home.joinBtn"></button>
    <div class="muted" id="homeerr" style="color:var(--r)"></div>
  </div>
</div>

<div class="screen" id="sc-join">
  <div class="center">
    <h1 class="logo" style="font-size:52px">1</h1>
    <div class="muted" data-i18n="join.entering"></div>
    <div class="code" id="joinroom">——————</div>
    <input type="text" id="jnick" maxlength="12" data-i18n-ph="ph.name">
    <input type="text" id="jpass" maxlength="16" data-i18n-ph="ph.password"
           style="text-transform:uppercase;letter-spacing:3px">
    <button class="btn" id="b-join2" data-i18n="join.enterBtn"></button>
    <div class="muted" id="joinerr" style="color:var(--r)"></div>
    <div class="muted" data-i18n-html="join.passwordHint"></div>
    <button class="btn sec sm" id="b-back" data-i18n="join.wrongRoom"></button>
  </div>
</div>

<div class="screen" id="sc-lobby">
  <div class="center">
    <div class="muted" data-i18n="lobby.scanHint"></div>
    <div class="code" id="roomcode">——————</div>
    <canvas id="qr"></canvas>
    <div class="qrnote" id="qrnote" style="display:none" data-i18n-html="lobby.qrUnknown"></div>
    <div class="pwbox"><span data-i18n="lobby.pwNotInQr"></span>
      <div class="pw" id="roompass">————</div></div>
    <input type="text" id="invite" style="font-size:12px;padding:9px 12px"
           data-i18n-ph="ph.publicUrl">
    <button class="btn sec sm" id="b-copy" data-i18n="lobby.copyBtn"></button>
    <div class="muted" id="framehint" style="display:none" data-i18n="lobby.frameHint"></div>
    <div class="plist" id="lobbylist"></div>
    <div class="opts" id="opts" style="display:none">
      <label class="opt"><input type="checkbox" id="o-strict4" checked>
        <span data-i18n-html="opt.strict4"></span></label>
      <label class="opt"><input type="checkbox" id="o-strictw">
        <span data-i18n="opt.strictw"></span></label>
      <label class="opt"><input type="checkbox" id="o-freedraw" checked>
        <span data-i18n="opt.freedraw"></span></label>
      <label class="opt"><input type="checkbox" id="o-stack">
        <span data-i18n="opt.stack"></span></label>
      <label class="opt"><input type="checkbox" id="o-handover" checked>
        <span data-i18n="opt.handover"></span></label>
      <label class="opt"><input type="checkbox" id="o-customwild">
        <span data-i18n="opt.customwild"></span></label>
      <div class="botrow">
        <span data-i18n="lobby.botOpponents"></span>
        <button class="chip" id="bot-minus">−</button>
        <b id="botn">0</b>
        <button class="chip" id="bot-plus">+</button>
        <button class="chip on" id="bot-level">normale</button>
      </div>
    </div>

"use strict";
/* ==========================================================================
   Uno Contro Tutti — un solo file, nessun server proprio.

   Signaling : MQTT 3.1.1 su WebSocket (broker pubblici, wss:443)
   Trasporto : WebRTC DataChannel via STUN, con fallback su relay MQTT cifrato
   Topologia : a stella — l'host è il server autoritativo del gioco
   Crypto    : ECDH P-256 per coppia + AES-GCM sui messaggi in relay
   ========================================================================== */

const $ = s => document.querySelector(s);
const rid = (n=8) => { let s=''; const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  for(let i=0;i<n;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; };
const b64  = u => btoa(String.fromCharCode.apply(null, new Uint8Array(u)));
const ub64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));

/* Preferenze e password della stanza restano sul dispositivo per il rientro
   rapido. localStorage sopravvive alla chiusura della scheda (sui telefoni
   succede di continuo); se è bloccato si ripiega, e in ultima istanza si
   richiede la password a mano.                                             */
const stores=()=>{ const o=[]; try{ if(localStorage) o.push(localStorage); }catch(e){}
  try{ if(sessionStorage) o.push(sessionStorage); }catch(e){} return o; };
const keep=(k,v)=>{ for(const s of stores()) try{ s.setItem(k,v); }catch(e){} };
const recall=k=>{ for(const s of stores()) try{ const v=s.getItem(k); if(v) return v; }catch(e){} return ''; };

/* Identità del dispositivo: sopravvive ai ricaricamenti, a differenza di
   Net.me che è nuovo a ogni sessione. Senza, un giocatore che ricarica la
   pagina risulta un estraneo per l'host finché il vecchio posto non scade
   (fino a 30s): nel frattempo se ne crea uno nuovo, e il vecchio resta un
   fantasma per sempre. Con l'id di dispositivo l'host riconosce subito
   "sei tu" e riprende lo stesso posto, anche prima che scada.             */
const DEVID = recall('uct_dev') || (()=>{ const d=rid(14); keep('uct_dev',d); return d; })();
